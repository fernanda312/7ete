<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>7ete</title>
<script>
(function () {
  var seg = 0; // custom domain serves at the root: no subpath segment
  var l = window.location;
  var path = l.pathname.split("/").slice(1 + seg).join("/");
  var qs = l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "";
  var url = l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
    l.pathname.split("/").slice(0, 1 + seg).join("/") + "/?/" + path + qs + l.hash;
  l.replace(url);
})();
</script>
</head>
<body></body>
</html>
